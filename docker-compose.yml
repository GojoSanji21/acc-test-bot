version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg_storage_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./proxies.txt:/app/proxies.txt
    # Example command override if you want to explicitly run python bot.py
    command: python bot.py
